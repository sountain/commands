function addChip(parent,alias){const chip=document.createElement('div');chip.className='chip';chip.innerHTML=`<span class="command-text" tabindex="0"></span><button class="copy" aria-label="${TEXT[lang].copy}"><img src="../copy.svg" alt=""></button>`;const txt=chip.querySelector('.command-text'),btn=chip.querySelector('.copy');txt.textContent=alias;txt.onclick=()=>selectText(txt);txt.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectText(txt)}};btn.onclick=async()=>{if(!await copyAlias(alias))return;chip.classList.add('done');btn.innerHTML=CHECK;btn.setAttribute('aria-label',TEXT[lang].copied);clearTimeout(chip._t);chip._t=setTimeout(()=>{chip.classList.remove('done');btn.innerHTML='<img src="../copy.svg" alt="">';btn.setAttribute('aria-label',TEXT[lang].copy)},1600)};parent.append(chip)}

el.textContent=item.name;a.append(label);nameEl.append(a)}else nameEl.textContent=item.name;const other=card.querySelector('.other-chip');if(other)addChip(other,(item.show[0]||'')+' '+(lang==='ru'?'@ник':'@viewer'));for(const alias of item.show)addChip(card.querySelector('.aliases'),alias);sec.querySelector('.grid').append(card)}root.append(sec)}empty.style.display=total?'none':'block'}
